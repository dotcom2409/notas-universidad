# ---------- 1. SSH ----------
- name: Endurecer SSH (sin root, sin contraseña, usuarios permitidos)
  ansible.builtin.template:
    src: 99-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Validar y reiniciar SSH

# ---------- 2. Firewall UFW ----------
# OJO: las reglas se agregan ANTES de activar UFW para no perder el acceso.
- name: Instalar UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: UFW - permitir SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: SSH administrativo (el SG lo limita a la IP admin)

- name: UFW - permitir la app solo desde la VPC (ALB y health checks)
  community.general.ufw:
    rule: allow
    port: "{{ app_port | string }}"
    proto: tcp
    src: "{{ vpc_cidr }}"
    comment: Trafico del ALB

- name: UFW - denegar entrada por defecto y activar
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

# ---------- 3. Fail2ban ----------
- name: Instalar Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configurar jail de SSH
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Reiniciar fail2ban

- name: Fail2ban activo al arrancar
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# ---------- 4. Parches de seguridad automáticos ----------
- name: Activar actualizaciones automáticas de seguridad
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
