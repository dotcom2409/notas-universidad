{% extends "base.html" %}
{% block title %}Estudiantes{% endblock %}
{% block content %}
<h1>Estudiantes</h1>
<form class="inline-form" method="post" action="/estudiantes">
  <input name="codigo" placeholder="Código (ej. 20261001)" required maxlength="20">
  <input name="nombre" placeholder="Nombre completo" required maxlength="120">
  <input name="programa" placeholder="Programa académico" required maxlength="120">
  <button type="submit">Agregar</button>
</form>
<table>
  <thead><tr><th>Código</th><th>Nombre</th><th>Programa</th><th></th></tr></thead>
  <tbody>
  {% for e in estudiantes %}
    <tr>
      <td>{{ e.codigo }}</td>
      <td><a href="/estudiantes/{{ e.id }}">{{ e.nombre }}</a></td>
      <td>{{ e.programa }}</td>
      <td>
        <form method="post" action="/estudiantes/{{ e.id }}/eliminar" onsubmit="return confirm('¿Eliminar a {{ e.nombre }} y sus notas?')">
          <button class="danger" type="submit">Eliminar</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="4" class="muted">No hay estudiantes registrados.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
