<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Registro de Notas{% endblock %} · Universidad</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">📘 Registro de Notas</a>
    <nav>
      <a href="/">Inicio</a>
      <a href="/estudiantes">Estudiantes</a>
      <a href="/asignaturas">Asignaturas</a>
      <a href="/notas">Registrar notas</a>
    </nav>
  </header>
  <main class="container">
    {% if msg %}<div class="alert ok">{{ msg }}</div>{% endif %}
    {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    Servido por <strong class="host">{{ hostname }}</strong> · v{{ version }}
  </footer>
</body>
</html>
