# Entorno de desarrollo LOCAL (app + PostgreSQL).
# En AWS la BD es RDS y la app corre con Docker en cada EC2 (vía Ansible).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-notas}
      POSTGRES_USER: ${DB_USER:-notas_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-notas_app} -d ${DB_NAME:-notas}"]
      interval: 5s
      retries: 10
    # Sin "ports": la BD no se expone fuera de la red de Docker

  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
